<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.C.E. | Subtitle Conversion Engine</title>
    <meta name="description" content="Free, 100% secure client-side subtitle format converter. Convert SRT, VTT, TTML, and TXT instantly without cloud uploads.">

    <!-- Global Assets -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://www.thesubtitlearcade.com/favicon.png">
    <link rel="apple-touch-icon" href="https://www.thesubtitlearcade.com/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.min.css?v=101">
    <link rel="stylesheet" href="style.css?v=100">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <style>
        /* ========================================================
           A.C.E. CONVERTER SPECIFIC STYLING
           ======================================================== */
        
        /* The 16:9 Anchor inside your standard site border */
        .arcade-wrapper {
          position: relative;
          width: 100%; 
          max-height: 100%;
          aspect-ratio: 16 / 9;
          margin: 0 auto; 
        }

        /* LAYER 1: CRT Text Content */
        .crt-content {
          position: absolute;
          z-index: 1;
          /* Adjust these percentages slightly if your cutout isn't dead center */
          top: 31%;    
          left: 36%;
          width: 28%;
          height: 27%;
          background-color: #020604;
          padding: 1.5%;
          box-sizing: border-box;
          overflow: hidden;
          box-shadow: inset 0 0 30px rgba(0, 240, 255, 0.15);
        }

        .inner-scanlines {
          position: absolute;
          top: 0; left: 0; right: 0; bottom: 0;
          background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
          background-size: 100% 4px;
          pointer-events: none;
          z-index: 5;
        }

        .crt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #00f0ff;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .crt-header h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.9vw;
            color: #00f0ff;
            text-shadow: 0 0 8px #00f0ff;
            margin: 0;
        }

        .crt-header .offset-display {
            font-family: 'VT323', monospace;
            font-size: 1.5vw;
            color: #ff007f;
            text-shadow: 0 0 8px #ff007f;
            margin: 0;
        }

        .crt-body {
            font-family: 'VT323', monospace;
            font-size: 1.2vw;
            color: #39ff14;
            text-shadow: 0 0 5px #39ff14;
            line-height: 1.4;
        }

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        /* LAYER 2: The Transparent Cabinet Image */
        .cabinet-layer {
          position: absolute;
          z-index: 2;
          top: 0; left: 0;
          width: 100%; height: 100%;
          background-size: contain;
          background-position: center;
          background-repeat: no-repeat;
          pointer-events: none; 
        }

<!-- LAYER 2.5: The Full-Canvas Marquee Stack -->
    <div class="full-canvas-marquee">
        
        <!-- Base Marquee (JPG with black background erased by CSS blend mode) -->
        <img src="marquee.jpg" class="marquee-full-layer" alt="Marquee Base">
        
        <!-- The Animated Letters -->
        <img src="T.png" class="marquee-full-layer m-flicker delay-1" alt="T">
        <img src="B.png" class="marquee-full-layer m-flicker delay-2" alt="B">
        <img src="L.png" class="marquee-full-layer m-flicker delay-3" alt="L">
        <img src="C.png" class="marquee-full-layer m-flicker delay-4" alt="C">
        
        <!-- The Animated Star -->
        <img src="RightStar.png" class="marquee-full-layer star-twinkle" alt="*">
        
    </div>

        /* LAYER 3: The Interactive Buttons */
        .control-deck {
          position: absolute;
          z-index: 3;
          top: 0; left: 0;
          width: 100%; height: 100%;
        }

        .invisible-btn {
          position: absolute;
          background: transparent;
          border: none;
          cursor: pointer;
          border-radius: 50%; 
        }

        /* Neon Glows on Interaction */
        .invisible-btn:hover {
          box-shadow: 0 0 15px 5px rgba(255, 42, 133, 0.6); 
          background: rgba(255, 42, 133, 0.2);
        }
        
        /* Persistent glow for the currently selected format */
        .invisible-btn.active {
          box-shadow: 0 0 15px 5px rgba(57, 255, 20, 0.6); 
          background: rgba(57, 255, 20, 0.2);
        }

        /* Joysticks */
        .left-joy { top: 73%; left: 33%; width: 4%; height: 7%; }
        .right-joy { top: 73%; left: 63%; width: 4%; height: 7%; box-shadow: 0 0 15px 5px rgba(0, 240, 255, 0.6); }
        .right-joy:hover { background: rgba(0, 240, 255, 0.2); }

        /* Left Button Cluster (Formats) */
        .l-btn-1 { top: 77%; left: 41%; width: 2.5%; height: 4.5%; }
        .l-btn-2 { top: 80%; left: 44%; width: 2.5%; height: 4.5%; }
        .l-btn-3 { top: 77%; left: 47%; width: 2.5%; height: 4.5%; }
        .l-btn-4 { top: 80%; left: 49.5%; width: 2.5%; height: 4.5%; }

        /* Center Mini Buttons (Timecode + / -) */
        .c-btn-1 { top: 76.5%; left: 52%; width: 1.5%; height: 2.5%; }
        .c-btn-2 { top: 76.5%; left: 55.5%; width: 1.5%; height: 2.5%; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="screen-wrapper">
    <div class="arcade-cabinet">
        
        <!-- Flexbox applied directly to the CRT screen to center the 16:9 image inside it -->
        <div class="crt-screen" style="display: flex; justify-content: center; align-items: center; background-color: #0b0213; padding: 0; overflow: hidden;">
            
            <!-- THE ARCADE CONVERTER -->
            <div class="arcade-wrapper">
                
                <!-- LAYER 1 (BOTTOM): The CRT Text -->
                <div class="crt-content">
                  <div class="inner-scanlines"></div>
                  
                  <div class="crt-header">
                      <h2>A.C.E. ONLINE</h2>
                      <p class="offset-display" id="timeOffsetDisplay">OFFSET: +0.0s</p>
                  </div>
                  
                  <div class="crt-body" id="dropZone">
                      <p class="blink" style="color: #fff;">> AWAITING SUBTITLE PAYLOAD...</p>
                      <p style="opacity: 0.7; margin-top: 20px;">[ CLICK LEFT JOYSTICK TO UPLOAD ]</p>
                  </div>
                  
                  <div class="crt-body hidden" id="qcReport">
                     <!-- JS will inject diagnostic data here -->
                  </div>
                  
                </div>

                <!-- LAYER 2 (MIDDLE): The Cabinet Image -->
                <!-- Be sure this points to your transparent screen cutout PNG -->
                <div class="cabinet-layer" style="background-image: url('Screen.png');"></div>

<!-- LAYER 4: The Subtitle Arcade Marquee -->
    <div class="marquee-zone">
      
      <!-- The Neon Framing Bars -->
      <img src="NeonTop.png" class="neon-bar neon-top" alt="---">
      <img src="NeonBottom.png" class="neon-bar neon-bottom" alt="---">

      <!-- Left Star -->
      <img src="Star1.png" class="marquee-star star-left" alt="*">
      
      <div class="marquee-text-block">
        <div class="marquee-row marquee-top">
            <div class="m-word">
                <img src="T1.png" class="m-let"><img src="H.png" class="m-let"><img src="E1.png" class="m-let">
            </div>
            <div class="m-word">
                <img src="S.png" class="m-let"><img src="U.png" class="m-let"><img src="B.png" class="m-let"><img src="T2.png" class="m-let"><img src="I.png" class="m-let"><img src="T3.png" class="m-let"><img src="L.png" class="m-let"><img src="E2.png" class="m-let">
            </div>
        </div>
        <div class="marquee-row marquee-bottom">
            <div class="m-word">
                <img src="A.png" class="m-let"><img src="R.png" class="m-let"><img src="C.png" class="m-let"><img src="A2.png" class="m-let"><img src="D.png" class="m-let"><img src="E3.png" class="m-let">
            </div>
        </div>
      </div>

      <!-- Right Star -->
      <img src="Star2.png" class="marquee-star star-right" alt="*">
      
    </div>

                <!-- LAYER 3 (TOP): The Invisible Interactive Control Deck -->
                <div class="control-deck">
                  
                  <!-- Left Joystick (Upload) -->
                  <button class="invisible-btn joystick left-joy" id="uploadBtn" title="Upload File" onclick="document.getElementById('fileInput').click()"></button>
                  
                  <!-- Format Buttons (Mapped to the left 4 buttons) -->
                  <button class="invisible-btn format-btn l-btn-1 active" data-format="vtt" title="VTT Format"></button>
                  <button class="invisible-btn format-btn l-btn-2" data-format="srt" title="SRT Format"></button>
                  <button class="invisible-btn format-btn l-btn-3" data-format="ttml" title="TTML Format"></button>
                  <button class="invisible-btn format-btn l-btn-4" data-format="txt" title="TXT Format"></button>

                  <!-- Timecode Buttons (Mapped to the center 2 buttons) -->
                  <button class="invisible-btn c-btn-1" id="decreaseTime" title="Shift -0.5s"></button>
                  <button class="invisible-btn c-btn-2" id="increaseTime" title="Shift +0.5s"></button>

                  <!-- Right Joystick (Execute) -->
                  <button class="invisible-btn joystick right-joy" id="executeBtn" title="Execute Conversion"></button>
                  
                  <!-- Hidden File Input -->
                  <input type="file" id="fileInput" accept=".srt,.vtt,.ttml,.xml,.txt" style="display: none;">
                  
                </div>
            </div>
            
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
