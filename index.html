<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.C.E. | Subtitle Conversion Engine</title>
    <meta name="description" content="Free, 100% secure client-side subtitle format converter. Convert SRT, VTT, TTML, and TXT instantly without cloud uploads.">

    <!-- Global Assets -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://www.thesubtitlearcade.com/favicon.png">
    <link rel="apple-touch-icon" href="https://www.thesubtitlearcade.com/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.min.css?v=101">
    <link rel="stylesheet" href="style.css?v=100">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <style>
        /* ========================================================
           A.C.E. CONVERTER SPECIFIC STYLING
           ======================================================== */
        
        /* The 16:9 Anchor inside your standard site border */
        .arcade-wrapper {
          position: relative;
          width: 100%; 
          max-height: 100%;
          aspect-ratio: 16 / 9;
          margin: 0 auto; 
        }

        <!-- LAYER 0: Deep Space Background -->
                <img src="deep-space-bg.jpg" class="space-bg-layer" alt="Deep Space">
                
                <!-- LAYER 1: The Cosmos Canvas (Stars, Planets, UFOs) -->
                <canvas id="cosmosCanvas" class="cosmos-canvas-layer"></canvas>

                <!-- LAYER 2: The Transparent Cabinet -->
                <img src="cabinet-cutout.png" class="cabinet-layer" alt="Cabinet Deck">

                <!-- LAYER 3: The CRT Screen -->
                <div class="crt-content">
                  <div class="inner-scanlines"></div>
                  
                  <!-- STATE 0: Attract Mode (Boot Up) -->
                  <div class="crt-state active-state" id="state0-attract">
                      <h2 class="attract-title">THE TRANSLATOR</h2>
                      <p class="attract-sub">CONVERT SUBTITLE FILES</p>
                      <p class="attract-sub pink">- NO CREDITS REQUIRED -</p>
                      
                      <div class="start-btn-container">
                          <span class="arcade-start-text blink">START</span>
                      </div>
                  </div>

        /* LAYER 2: The Transparent Cabinet Image */
        .cabinet-layer {
          position: absolute;
          z-index: 2;
          top: 0; left: 0;
          width: 100%; height: 100%;
          background-size: contain;
          background-position: center;
          background-repeat: no-repeat;
          pointer-events: none; 
        }


        /* LAYER 3: The Interactive Buttons */
        .control-deck {
          position: absolute;
          z-index: 3;
          top: 0; left: 0;
          width: 100%; height: 100%;
        }

        .invisible-btn {
          position: absolute;
          background: transparent;
          border: none;
          cursor: pointer;
          border-radius: 50%; 
        }

        /* Neon Glows on Interaction */
        .invisible-btn:hover {
          box-shadow: 0 0 15px 5px rgba(255, 42, 133, 0.6); 
          background: rgba(255, 42, 133, 0.2);
        }
        
        /* Persistent glow for the currently selected format */
        .invisible-btn.active {
          box-shadow: 0 0 15px 5px rgba(57, 255, 20, 0.6); 
          background: rgba(57, 255, 20, 0.2);
        }

        /* Joysticks */
        .left-joy { top: 73%; left: 33%; width: 4%; height: 7%; }
        .right-joy { top: 73%; left: 63%; width: 4%; height: 7%; box-shadow: 0 0 15px 5px rgba(0, 240, 255, 0.6); }
        .right-joy:hover { background: rgba(0, 240, 255, 0.2); }

        /* Left Button Cluster (Formats) */
        .l-btn-1 { top: 77%; left: 41%; width: 2.5%; height: 4.5%; }
        .l-btn-2 { top: 80%; left: 44%; width: 2.5%; height: 4.5%; }
        .l-btn-3 { top: 77%; left: 47%; width: 2.5%; height: 4.5%; }
        .l-btn-4 { top: 80%; left: 49.5%; width: 2.5%; height: 4.5%; }

        /* Center Mini Buttons (Timecode + / -) */
        .c-btn-1 { top: 76.5%; left: 52%; width: 1.5%; height: 2.5%; }
        .c-btn-2 { top: 76.5%; left: 55.5%; width: 1.5%; height: 2.5%; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="screen-wrapper">
    <div class="arcade-cabinet">
        
        <!-- Flexbox applied directly to the CRT screen to center the 16:9 image inside it -->
        <div class="crt-screen" style="display: flex; justify-content: center; align-items: center; background-color: #0b0213; padding: 0; overflow: hidden;">
            
            <!-- THE ARCADE CONVERTER -->
            <div class="arcade-wrapper">
                
                <!-- LAYER 1 (BOTTOM): The CRT Text -->
                <div class="crt-content">
                  <div class="inner-scanlines"></div>
                  
                  <div class="crt-header">
                      <h2>A.C.E. ONLINE</h2>
                      <p class="offset-display" id="timeOffsetDisplay">OFFSET: +0.0s</p>
                  </div>
                  
                  <div class="crt-body" id="dropZone">
                      <p class="blink" style="color: #fff;">> AWAITING SUBTITLE PAYLOAD...</p>
                      <p style="opacity: 0.7; margin-top: 20px;">[ CLICK LEFT JOYSTICK TO UPLOAD ]</p>
                  </div>
                  
                  <div class="crt-body hidden" id="qcReport">
                     <!-- JS will inject diagnostic data here -->
                  </div>
                  
                </div>

                <!-- LAYER 2 (MIDDLE): The Cabinet Image as a True HTML Element -->
                <img src="Screen.png" class="cabinet-layer" alt="Cabinet Deck">

                <!-- LAYER 2.5: The Full-Canvas Marquee Stack -->
                <div class="full-canvas-marquee">
                    <!-- Base Marquee (JPG with black background erased by CSS blend mode) -->
                    <img src="marquee.png" class="marquee-full-layer" alt="Marquee Base">
                    
                    <!-- The Animated Letters -->
                    <img src="T.png" class="marquee-full-layer m-flicker delay-1" alt="T">
                    <img src="B.png" class="marquee-full-layer m-flicker delay-2" alt="B">
                    <img src="L.png" class="marquee-full-layer m-flicker delay-3" alt="L">
                    <img src="C.png" class="marquee-full-layer m-flicker delay-4" alt="C">
                    
                    <!-- The Animated Star -->
                    <img src="RightStar.png" class="marquee-full-layer star-twinkle" alt="*">
                </div>

                <!-- LAYER 3 (TOP): The Interactive Control Deck -->
                <div class="control-deck">
                  
                  <!-- Master Actions -->
                  <button class="arcade-btn load-btn" id="uploadBtn" title="Load File"></button>
                  <button class="arcade-btn ignore-btn" id="ignoreBtn" title="Ignore Warnings"></button>
                  <button class="arcade-btn execute-btn" id="executeBtn" title="Execute Conversion"></button>
                  <button class="arcade-btn reset-btn" id="resetBtn" title="Reset Machine"></button>
                  <button class="arcade-btn hq-btn" id="arcadeBtn" title="Return to HQ"></button>

                  <!-- Timecode Calibrators -->
                  <button class="arcade-btn cal-btn minus-btn" id="decreaseTime" title="Shift Backward"></button>
                  <button class="arcade-btn cal-btn plus-btn" id="increaseTime" title="Shift Forward"></button>

                  <!-- Format Outputs -->
                  <button class="arcade-btn format-btn srt-btn" data-format="srt"></button>
                  <button class="arcade-btn format-btn vtt-btn" data-format="vtt"></button>
                  <button class="arcade-btn format-btn ttml-btn" data-format="ttml"></button>
                  <button class="arcade-btn format-btn xml-btn" data-format="xml"></button>
                  <button class="arcade-btn format-btn txt-btn" data-format="txt"></button>
                  
                  <!-- Hidden File Input -->
                  <input type="file" id="fileInput" accept=".srt,.vtt,.ttml,.xml,.txt" style="display: none;">
                  
                </div>
            </div>
            
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
