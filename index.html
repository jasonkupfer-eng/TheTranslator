<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Translator | Subtitle Conversion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- The Main 16:9 Wrapper -->
  <div class="arcade-wrapper">

    <!-- LAYER 1 (BOTTOM): The CRT Text -->
    <div class="crt-content">
      <div class="scanlines"></div>
      <h2>A.C.E. ONLINE</h2>
      <p class="blink">> INSERT SUBTITLE FILE...</p>
      <div class="diagnostic-readout">
         <!-- JS will inject diagnostic data here -->
      </div>
    </div>

    <!-- LAYER 2 (MIDDLE): The Cabinet Image -->
    <!-- Note: Make sure to point this to your actual transparent .png file -->
    <div class="cabinet-layer" style="background-image: url('Screen.png');"></div>

    <!-- LAYER 3 (TOP): The Invisible Interactive Control Deck -->
    <div class="control-deck">
      
      <!-- Left Controls -->
      <button class="invisible-btn joystick left-joy" id="uploadBtn" title="Upload File"></button>
      <button class="invisible-btn arcade-btn l-btn-1" data-format="vtt" title="VTT Format"></button>
      <button class="invisible-btn arcade-btn l-btn-2" data-format="srt" title="SRT Format"></button>
      <button class="invisible-btn arcade-btn l-btn-3" data-format="ttml" title="TTML Format"></button>
      <button class="invisible-btn arcade-btn l-btn-4" data-format="txt" title="TXT Format"></button>

      <!-- Center Controls (Timecode) -->
      <button class="invisible-btn arcade-btn c-btn-1" id="timeDown" title="Shift -0.5s"></button>
      <button class="invisible-btn arcade-btn c-btn-2" id="timeUp" title="Shift +0.5s"></button>

      <!-- Right Controls -->
      <button class="invisible-btn joystick right-joy" id="executeBtn" title="Execute Conversion"></button>
      
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
